[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfall-multimodal-knowledge-distillation"
version = "0.1.0"
description = "Offline SmartFallMM experiments with inertial transformers and multimodal knowledge distillation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Pratyay Dhar"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "torch>=2.6,<3", "fastdtw==0.3.4",
  "matplotlib>=3.8,<4"
]

[project.urls]
"Repository" = "https://github.com/pratyaydr/smartfall-multimodal-knowledge-distillation"
"Original Kaggle Notebook" = "https://www.kaggle.com/code/pratyaydhar/notebook2d06429765"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[project.scripts]
smartfall = "smartfall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
